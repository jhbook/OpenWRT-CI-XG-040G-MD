name: Auto-Clean

#CI计划
on:
  # 自动清理已关闭（2026-10-30）：不再随 AIR-TCBOOT 自动触发，仅保留手动运行
  # workflow_run:
  #   workflows: ["AIR-TCBOOT"]
  #   types:
  #     - completed
  #手动清理
  workflow_dispatch:

permissions:
  contents: write   # 删除旧 Release / Tag
  actions: write    # 删除旧 Workflow 运行记录

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@v0.1.0
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          #保留 2 条：AIROHA-ONU 与 AIROHA-TCBOOT 各一条，避免互相删除
          releases_keep_latest: 2
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 1
