name: Cache-Clean

on:
  # 自动清理已关闭（2026-10-30）：不再每周定时清缓存，仅保留手动运行
  # schedule:
  #   - cron: 0 20 * * 0
  #手动清理
  workflow_dispatch:

permissions:
  actions: write    # gh cache delete

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Clean
        run: gh cache delete --all
